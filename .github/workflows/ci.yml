name: Firmware CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore PlatformIO cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-platformio-6.1.19-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-6.1.19-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio==6.1.19

      - name: Build universal release firmware
        run: pio run -e release

      - name: Upload test firmware
        uses: actions/upload-artifact@v4
        with:
          name: protopanda-firmware-${{ github.sha }}
          path: .pio/build/release/firmware.bin
          retention-days: 14
          if-no-files-found: error
